[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-mixture-of-experts"
version = "0.1.0"
description = "PyTorch research scaffold for semantic routing in a compact mixture-of-experts language model."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Surya Vaddhiparthy" }
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "faiss-cpu>=1.8; platform_system != \"Windows\"",
]

[tool.setuptools]
package-dir = { "astra_x_base" = "." }
packages = [
  "astra_x_base",
  "astra_x_base.core",
  "astra_x_base.routing",
  "astra_x_base.clustering",
  "astra_x_base.observe",
  "astra_x_base.training",
]
